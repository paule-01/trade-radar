name: Tagesradar (ARK, Insider, Politiker, Fonds)

on:
  schedule:
    - cron: "17 6 * * 1-6"   # Mo–Sa um 06:17 UTC = 07:17 Uhr (Winter) / 08:17 Uhr (Sommer) deutscher Zeit
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tagesradar

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m radar.daily
      # Zustand speichern (hält das Repo außerdem "aktiv", damit GitHub die Zeitpläne nicht abschaltet)
      - name: Zustand speichern
        if: always()
        run: |
          git config user.name "trade-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > state/last_run.txt
          git add state
          git commit -m "Tagesradar-Zustand aktualisiert" || echo "nichts zu speichern"
          git push
